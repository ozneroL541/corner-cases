name: Tests

on:
    push:
        branches: [ "master", "dev" ]
    pull_request:
        branches: [ "master", "dev" ]

jobs:
    test:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                go-version: ["1.27.3"]

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  submodules: recursive

            - name: Set up Go
              uses: actions/setup-go@v7
              with:
                go-version: ${{ matrix.go-version }}

            - name: Run Tests
              run: |
                make test
