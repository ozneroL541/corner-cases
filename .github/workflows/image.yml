name: Docker Image

on:
    release:
        types: [created]

permissions:
    contents: read
    packages: write

jobs:
    image:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                submodules: recursive

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in GitHub Container Registry
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
            
            - name: Repository Name
              id: repo-name
              run: |
                image_repository=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
                echo "image_repository=$image_repository" >> "$GITHUB_OUTPUT"
            
            - name: Set image version
              id: image-version
              # If it's a release, use the tag as the version,
              # If it has v prefix, remove it, otherwise use the version as is,
              # otherwise use the short SHA of the commit
              run: |
                image_repository=$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
                echo "image_repository=$image_repository" >> "$GITHUB_OUTPUT"
                if [ "$GITHUB_EVENT_NAME" = "release" ]; then
                  if [[ "$GITHUB_REF_NAME" == v* ]]; then
                    echo "image_version=${GITHUB_REF_NAME:1}" >> "$GITHUB_OUTPUT"
                  else
                    echo "image_version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
                  fi
                else
                    echo "image_version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
                fi
            
            - name: Build and push image
              uses: docker/build-push-action@v6
              with:
                context: .
                file: Dockerfile
                push: true
                tags: |
                  ghcr.io/${{ steps.repo-name.outputs.image_repository }}:latest
                  ghcr.io/${{ steps.repo-name.outputs.image_repository }}:${{ steps.image-version.outputs.image_version }}
                  ghcr.io/${{ steps.repo-name.outputs.image_repository }}:${{ github.sha }}
